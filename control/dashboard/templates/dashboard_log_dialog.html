<dialog class="dialog" id="log-dialog" aria-labelledby="log-title">
  <div class="sm:max-w-5xl">
      <header class="dialog-head gap-3">
        <h2 id="log-title">Provider Logs</h2>
        <div class="items-center flex gap-2">
          <small id="log-follow-state" role="status">Following</small>
          <button class="btn" data-variant="secondary" data-size="sm" data-close type="button">
            Close
          </button>
        </div>
      </header>
      <section class="dialog-body">
        <pre id="log-output" aria-live="polite">Connecting…</pre>
      </section>
  </div>
</dialog>
