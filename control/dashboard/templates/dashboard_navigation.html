<header class="sticky top-0 z-20 border-b bg-background/95 backdrop-blur">
  <div class="mx-auto flex w-full max-w-7xl items-center gap-3 px-4 py-2">
    <span class="shrink-0 font-semibold">Comfy Control</span>
    <nav class="flex grow overflow-x-auto" aria-label="Primary Navigation">
      <ul class="flex items-center gap-1">
        {% for name, label, path in [("generate", "Generate", "/generate"),
        ("media", "Media", "/media"), ("history", "History", "/history"),
        ("events", "Events", "/events"), ("providers", "Providers", "/providers")] %}
        <li><a class="btn" data-variant="{% if page == name %}secondary{% else %}ghost{% endif %}" data-size="sm" {% if page == name %}aria-current="page"{% endif %} href="{{ path }}">{{ label }}</a></li>
        {% endfor %}
      </ul>
      <ul class="ms-auto flex items-center gap-1">
        <li><a class="btn" data-variant="{% if page == 'settings' %}secondary{% else %}ghost{% endif %}" data-size="sm" {% if page == "settings" %}aria-current="page"{% endif %} href="/settings">Settings</a></li>
        <li><form action="/logout" method="post"><button class="btn" data-variant="ghost" data-size="sm" type="submit">Logout</button></form></li>
      </ul>
    </nav>
  </div>
</header>
