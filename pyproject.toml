[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.32.0"]

[project]
description = "An OpenAI-compatible gateway for ComfyUI"
dynamic = ["version"]
license = "AGPL-3.0-only"
name = "comfy-control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=49,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.14,<4",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=17,<18",
]

[project.optional-dependencies]
build = ["huggingface-hub>=0.28,<2"]
modal = ["modal>=1.5.3,<2"]
test = ["aiohttp>=3.11,<4", "pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
vast = [
  "vastai @ git+https://github.com/vast-ai/vast-cli.git@f7171feb403fd037d2d9b9dcc379aebed80311a7",
]

[project.scripts]
comfy-control = "comfy_control.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["comfy_control"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "comfy_control/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["comfy_control"]
