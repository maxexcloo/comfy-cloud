[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfy-cloud"
version = "0.1.0"
description = "A small OpenAI-compatible and native ComfyUI cloud gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
build = ["huggingface-hub>=0.28,<2"]
s3 = ["boto3>=1.35,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
comfy-cloud = "comfy_cloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_cloud"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
