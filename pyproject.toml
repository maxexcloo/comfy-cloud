[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "comfy-control"
version = "0.1.0"
description = "An OpenAI-compatible gateway for ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "prometheus-client>=0.21,<1",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=17,<18",
]

[project.optional-dependencies]
build = ["huggingface-hub>=0.28,<2"]
modal = ["modal>=1.5.3,<2"]
s3 = ["boto3>=1.35,<2"]
test = ["aiohttp>=3.11,<4", "pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
vast = ["aiohttp>=3.11,<4"]

[project.scripts]
comfy-control = "comfy_control.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "comfy_control"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["comfy_control"]
