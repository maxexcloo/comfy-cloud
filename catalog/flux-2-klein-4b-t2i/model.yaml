id: flux-2-klein-4b/text-to-image
profile: flux-2-klein-4b
operation: image_generation
workflow: workflow.json
owned_by: black-forest-labs
aliases: [flux-2-klein-4b]
input_map:
  prompt: {node: "4", input: text}
  width:
    - {node: "6", input: width}
    - {node: "9", input: width}
  height:
    - {node: "6", input: height}
    - {node: "9", input: height}
  seed: {node: "7", input: noise_seed}
  steps: {node: "9", input: steps}
output: {node: "13", type: image}
defaults:
  width: 1024
  height: 1024
  seed: 0
  steps: 4
required_files:
  - diffusion_models/flux-2-klein-4b.safetensors
  - text_encoders/qwen_3_4b.safetensors
  - vae/flux2-vae.safetensors
