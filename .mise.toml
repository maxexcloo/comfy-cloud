[tools]
actionlint = "1.7.12"
hadolint = "2.15.1"
"pipx:modal" = "1.5.3"
"pipx:vastai" = "1.5.2"
prek = "0.4.12"
prettier = "3.9.6"
python = "3.14.7"
ruff = "0.16.2"
"ubi:runpod/runpodctl" = "2.9.0"
uv = "0.12.3"

[tasks.check]
description = "Run all repository checks"
run = "prek run --all-files && uv run --isolated --extra test pytest -q"

[tasks.cleanup]
description = "Remove caches and bytecode"
run = """
find . -path ./.git -prune -o \
  -type d \\( -name .pytest_cache -o -name .ruff_cache -o -name __pycache__ \\) \
  -prune -exec rm -rf -- {} +
find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f -- {} +
"""

[tasks.deploy-modal]
description = "Deploy the Modal app"
run = "modal deploy deploy/modal_app.py"

[tasks.deploy-runpod]
description = "Create a RunPod pod from the template"
run = """
runpodctl create pod \
  --containerDiskSize 100 \
  --env "API_KEY=${API_KEY}" \
  --env "COMFY_UI_PASSWORD=${COMFY_UI_PASSWORD}" \
  --env COMFY_UI_USERNAME="${COMFY_UI_USERNAME:-comfy}" \
  --env MODE=pod \
  --imageName "${IMAGE_NAME}:latest" \
  --name comfy-cloud \
  --ports 8000/http
"""

[tasks.deploy-vast]
description = "Create a Vast.ai instance from the template"
run = """
vastai create instance --disk 100 \
  --env "API_KEY=${API_KEY}" \
  --env "COMFY_UI_PASSWORD=${COMFY_UI_PASSWORD}" \
  --env COMFY_UI_USERNAME="${COMFY_UI_USERNAME:-comfy}" \
  --env MODE=pod \
  --image "${IMAGE_NAME}:latest" \
  --label comfy-cloud \
  --onstart-cmd 'python3 -m comfy_cloud.supervisor' \
  "${VAST_OFFER_ID:?set VAST_OFFER_ID to an offer from `vastai search offers`}"
"""

[tasks.fmt]
description = "Format all files"
run = """
prettier --write .
ruff check --fix --select I .
ruff format .
"""

[tasks.setup]
description = "Copy local env template if missing, then install Git hooks"
run = """
if [[ ! -f .mise.local.toml ]]; then
  cp .mise.local.toml.default .mise.local.toml
  echo "Created .mise.local.toml - please add your secrets"
  exit 1
fi
prek install
"""
