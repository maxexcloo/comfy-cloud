[env]
# Image published by `mise run deploy`. Non-secret; overridable in .mise.local.toml.
IMAGE_NAME = "ghcr.io/maxexcloo/comfy-cloud"

[tools]
actionlint = "1.7.12"
hadolint = "2.15.1"
prek = "0.4.12"
prettier = "3.9.6"
python = "3.13"
ruff = "0.16.1"
uv = "0.12.1"

[tasks.check]
description = "Run all repository checks"
run = "prek run --all-files && uv run --extra test pytest -q"

[tasks.cleanup]
description = "Remove caches and bytecode"
run = """
find . -path ./.git -prune -o \
  -type d \\( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache \\) \
  -prune -exec rm -rf -- {} +
find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f -- {} +
"""

[tasks.deploy]
description = "Build and push the runtime image"
run = """
echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER:-maxexcloo}" --password-stdin
docker build -t "${IMAGE_NAME}:latest" .
docker push "${IMAGE_NAME}:latest"
"""

[tasks.fmt]
description = "Format all files"
run = """
prettier --write .
ruff check --fix --select I .
ruff format .
"""

[tasks.setup]
description = "Copy local env template if missing, then install Git hooks"
run = """
if [[ ! -f .mise.local.toml ]]; then
  cp .mise.local.toml.default .mise.local.toml
  echo "Created .mise.local.toml - please add your secrets"
  exit 1
fi
prek install
"""
