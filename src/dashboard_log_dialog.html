<dialog id="log-dialog" aria-labelledby="log-title">
  <article>
    <header class="dialog-head">
      <h2 id="log-title">Provider Logs</h2>
      <div class="dialog-actions">
        <small id="log-follow-state" role="status">Following</small>
        <button class="secondary" type="button" data-close>Close</button>
      </div>
    </header>
    <div class="dialog-body">
      <pre id="log-output" aria-live="polite">Connecting…</pre>
    </div>
  </article>
</dialog>
