<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>
      {% block title %}{{ page | title }}{% endblock %} · Comfy Control
    </title>
    <link rel="stylesheet" href="/assets/dashboard.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip To Content</a>
    <header>
      <a href="/media"
        ><small>GPU Orchestration</small>
        <h1>Comfy Control</h1></a
      >
    </header>
    {% include "dashboard_navigation.html" %}
    <main id="content">
      {% if message %}
      <p class="notice" role="status">{{ message }}</p>
      {% endif %} {% block content %}{% endblock %}
    </main>
    <dialog id="media-dialog" aria-labelledby="media-title">
      <div class="dialog-head">
        <div>
          <small id="media-kind">Media</small>
          <h2 id="media-title">Media Details</h2>
        </div>
        <button type="button" data-close>Close</button>
      </div>
      <div class="dialog-body" id="media-detail"><p>Loading…</p></div>
    </dialog>
    <script src="/assets/dashboard.js"></script>
  </body>
</html>
