models:
  - id: image-edit
    operation: image_edit
    targets:
      - { model: flux-2-klein-9b/image-edit, provider: local-pod }
      - { model: flux-2-klein-9b/image-edit, provider: modal-serverless }
      - { model: flux-2-klein-9b/image-edit, provider: runpod-pod }
      - { model: flux-2-klein-9b/image-edit, provider: runpod-serverless }
      - { model: flux-2-klein-9b/image-edit, provider: salad-serverless }
      - { model: flux-2-klein-9b/image-edit, provider: vast-pod }
      - { model: flux-2-klein-9b/image-edit, provider: vast-serverless }
      - { model: grok-imagine-image-quality, provider: cliproxyapi }
  - id: image-generation
    operation: image_generation
    targets:
      - { model: flux-2-klein-9b/text-to-image, provider: local-pod }
      - { model: flux-2-klein-9b/text-to-image, provider: modal-serverless }
      - { model: flux-2-klein-9b/text-to-image, provider: runpod-pod }
      - { model: flux-2-klein-9b/text-to-image, provider: runpod-serverless }
      - { model: flux-2-klein-9b/text-to-image, provider: salad-serverless }
      - { model: flux-2-klein-9b/text-to-image, provider: vast-pod }
      - { model: flux-2-klein-9b/text-to-image, provider: vast-serverless }
      - { model: grok-imagine-image-quality, provider: cliproxyapi }
  - id: image-to-video
    operation: video_generation
    targets:
      - { model: minimax-h3/image-to-video, provider: modal-serverless }
      - { model: minimax-h3/image-to-video, provider: runpod-pod }
      - { model: minimax-h3/image-to-video, provider: runpod-serverless }
      - { model: minimax-h3/image-to-video, provider: salad-serverless }
      - { model: minimax-h3/image-to-video, provider: vast-pod }
      - { model: minimax-h3/image-to-video, provider: vast-serverless }
      - { model: grok-imagine-video-1.5, provider: cliproxyapi }
  - id: text-to-video
    operation: video_generation
    targets:
      - { model: minimax-h3/text-to-video, provider: modal-serverless }
      - { model: minimax-h3/text-to-video, provider: runpod-pod }
      - { model: minimax-h3/text-to-video, provider: runpod-serverless }
      - { model: minimax-h3/text-to-video, provider: salad-serverless }
      - { model: minimax-h3/text-to-video, provider: vast-pod }
      - { model: minimax-h3/text-to-video, provider: vast-serverless }
      - { model: grok-imagine-video-1.5, provider: cliproxyapi }

providers:
  - id: cliproxyapi
    aliases: [cliproxy]
    api_key: env.CLIPROXY_API_KEY
    base_url: env.CLIPROXY_URL
    enabled_if: CLIPROXY_API_KEY
    health_path: /v1/models
    idle_seconds: 0
    platform: CLI Proxy API
    type: proxy
    usage:
      kind: cliproxyapi
      url: ${CLIPROXY_URL}/v0/management/usage-statistics-enabled
      headers:
        authorization: Bearer ${CLIPROXY_MANAGEMENT_KEY}
  - id: local-pod
    api_key: env.WORKER_API_KEY
    base_url: env.LOCAL_POD_URL
    enabled_if: LOCAL_POD_URL
    idle_seconds: 0
    platform: Local
    type: pod
  - id: modal-serverless
    actions:
      deploy:
        internal: modal-deploy
      terminate:
        confirmation: Terminate the Modal deployment? Its volume will be preserved.
        internal: modal-terminate
    api_key: env.WORKER_API_KEY
    enabled_if: MODAL_TOKEN_ID
    idle_seconds: 0
    management:
      function: serve
      kind: modal
      name: comfy-control
    platform: Modal
    type: serverless
    usage:
      kind: modal
  - id: runpod-pod
    actions:
      deploy:
        internal: provider-deploy
        resource_id_path: id
      terminate:
        confirmation: Terminate the RunPod Pod? Its Pod volume will be deleted.
        internal: provider-terminate
    aliases: [runpod]
    api_key: env.WORKER_API_KEY
    enabled_if: RUNPOD_API_KEY
    idle_seconds: 600
    management:
      kind: runpod-pod
      name: comfy-control
    platform: RunPod
    type: pod
    usage:
      kind: runpod
      url: https://rest.runpod.io/v1/billing/pods
      headers:
        authorization: Bearer ${RUNPOD_API_KEY}
    lifecycle:
      start:
        url: https://rest.runpod.io/v1/pods/{resource_id}/start
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
      stop:
        confirmation: Stop the RunPod Pod?
        url: https://rest.runpod.io/v1/pods/{resource_id}/stop
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
  - id: runpod-serverless
    actions:
      deploy:
        internal: provider-deploy
        resource_id_path: id
      scale-down:
        method: PATCH
        url: https://rest.runpod.io/v1/endpoints/{resource_id}
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
        json:
          workersMin: 0
      scale-up:
        method: PATCH
        url: https://rest.runpod.io/v1/endpoints/{resource_id}
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
        json:
          workersMin: 1
      terminate:
        confirmation: Terminate the RunPod Serverless endpoint and its workers?
        internal: provider-terminate
    api_key: env.WORKER_API_KEY
    enabled_if: RUNPOD_API_KEY
    idle_seconds: 0
    management:
      kind: runpod-serverless
      name: comfy-control
    platform: RunPod
    type: serverless
    usage:
      kind: runpod
      url: https://rest.runpod.io/v1/billing/endpoints
      headers:
        authorization: Bearer ${RUNPOD_API_KEY}
  - id: salad-serverless
    actions:
      deploy:
        internal: provider-deploy
        resource_id_path: id
      terminate:
        confirmation: Terminate the SaladCloud container group?
        internal: provider-terminate
    api_key: env.WORKER_API_KEY
    enabled_if: SALAD_API_KEY
    idle_seconds: 600
    management:
      kind: salad
      name: comfy-control
    platform: SaladCloud
    type: serverless
    usage:
      kind: salad
  - id: vast-pod
    actions:
      deploy:
        internal: provider-deploy
        resource_id_path: new_contract
      terminate:
        confirmation: Terminate the Vast.ai Pod? Its instance disk will be deleted.
        internal: provider-terminate
    api_key: env.WORKER_API_KEY
    enabled_if: VAST_API_KEY
    idle_seconds: 600
    management:
      kind: vast-pod
      name: comfy-control-pod
    platform: Vast.ai
    type: pod
    usage:
      kind: vast
      url: https://console.vast.ai/api/v0/users/current/
      headers:
        authorization: Bearer ${VAST_API_KEY}
    lifecycle:
      start:
        method: PUT
        url: https://console.vast.ai/api/v0/instances/{resource_id}/
        headers:
          authorization: Bearer ${VAST_API_KEY}
        json:
          state: running
      stop:
        confirmation: Stop the Vast.ai Pod?
        method: PUT
        url: https://console.vast.ai/api/v0/instances/{resource_id}/
        headers:
          authorization: Bearer ${VAST_API_KEY}
        json:
          state: stopped
  - id: vast-serverless
    actions:
      deploy:
        internal: provider-deploy
        resource_id_path: id
      terminate:
        confirmation: Terminate the Vast.ai Serverless endpoint?
        internal: provider-terminate
    api_key: env.WORKER_API_KEY
    enabled_if: VAST_API_KEY
    idle_seconds: 0
    management:
      kind: vast-serverless
      name: comfy-control-serverless
    platform: Vast.ai
    type: serverless
    usage:
      kind: vast
      url: https://console.vast.ai/api/v0/users/current/
      headers:
        authorization: Bearer ${VAST_API_KEY}
