models:
  - id: flux/text-to-image
    operation: image_generation
    targets:
      - model: flux-2-klein-4b/text-to-image
        provider: runpod
      - model: grok-imagine-image
        provider: cliproxy
  - id: grok/quality-text-to-image
    operation: image_generation
    targets:
      - model: grok-imagine-image-quality
        provider: cliproxy
  - id: grok/text-to-image
    operation: image_generation
    targets:
      - model: grok-imagine-image
        provider: cliproxy
  - id: minimax/text-to-video
    operation: video_generation
    targets:
      - model: minimax-h3/text-to-video
        provider: runpod

providers:
  - id: cliproxy
    api_key: env.CLIPROXY_API_KEY
    base_url: http://cliproxy:8317
    health_path: /v1/models
    idle_seconds: 0
  - id: runpod
    api_key: env.WORKER_API_KEY
    base_url: https://{resource_id}-8000.proxy.runpod.net
    idle_seconds: 600
    actions:
      deploy:
        confirmation: Deploy the worker?
        resource_id_path: id
        url: https://rest.runpod.io/v1/pods
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
        json:
          containerDiskInGb: 30
          gpuCount: 1
          imageName: ghcr.io/maxexcloo/ai-router:worker
          name: comfy-control
          volumeInGb: 100
          volumeMountPath: /workspace
          env:
            API_KEY: ${WORKER_API_KEY}
            JOBS_DIR: /workspace/jobs
            MODE: serverless
            MODEL_PROFILES: flux-2-klein-4b
            MODELS_DIR: /workspace/models
          gpuTypeIds:
            - NVIDIA GeForce RTX 4090
          ports:
            - 8000/http
      destroy:
        confirmation: Destroy the worker and its local data?
        method: DELETE
        url: https://rest.runpod.io/v1/pods/{resource_id}
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
      status:
        method: GET
        url: https://rest.runpod.io/v1/pods/{resource_id}
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
    lifecycle:
      start:
        url: https://rest.runpod.io/v1/pods/{resource_id}/start
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
      stop:
        confirmation: Stop the worker?
        url: https://rest.runpod.io/v1/pods/{resource_id}/stop
        headers:
          authorization: Bearer ${RUNPOD_API_KEY}
