name: comfy-control

services:
  comfy-control:
    build:
      context: .
      dockerfile: Dockerfile.control
    environment:
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:-}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:-}
      CLIPROXY_URL: ${CLIPROXY_URL:-}
      COMFYUI_ARGS: ${COMFYUI_ARGS:-}
      COMFY_UI_PASSWORD: ${COMFY_UI_PASSWORD:-}
      COMFY_UI_USERNAME: ${COMFY_UI_USERNAME:-comfy}
      CONTROL_API_KEY: ${CONTROL_API_KEY:?set CONTROL_API_KEY in .env}
      CONTROL_CONFIG: /config/control.yaml
      CONTROL_DATABASE: /data/comfy-control.db
      CONTROL_MAXIMUM_REQUEST_BYTES: ${CONTROL_MAXIMUM_REQUEST_BYTES:-104857600}
      CONTROL_UI_PASSWORD: ${CONTROL_UI_PASSWORD:?set CONTROL_UI_PASSWORD in .env}
      CONTROL_UI_USERNAME: ${CONTROL_UI_USERNAME:-comfy}
      HF_TOKEN: ${HF_TOKEN:-}
      LOCAL_POD_URL: ${LOCAL_POD_URL:-}
      MAXIMUM_PENDING_GENERATIONS: ${MAXIMUM_PENDING_GENERATIONS:-8}
      MAXIMUM_REQUEST_BYTES: ${MAXIMUM_REQUEST_BYTES:-104857600}
      MODAL_GPU: ${MODAL_GPU:-L40S}
      MODAL_MIN_CONTAINERS: ${MODAL_MIN_CONTAINERS:-0}
      MODAL_MODEL_VOLUME: ${MODAL_MODEL_VOLUME:-comfy-control-models}
      MODAL_SCALEDOWN_WINDOW: ${MODAL_SCALEDOWN_WINDOW:-60}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODEL_PROFILES: ${MODEL_PROFILES:-flux-2-klein-9b}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_DATA_CENTRES: ${RUNPOD_DATA_CENTRES:-}
      RUNPOD_GPU_TYPES: ${RUNPOD_GPU_TYPES:-}
      RUNPOD_MAXIMUM_WORKERS: ${RUNPOD_MAXIMUM_WORKERS:-1}
      SALAD_API_KEY: ${SALAD_API_KEY:-}
      SALAD_GPU_CLASSES: ${SALAD_GPU_CLASSES:-}
      SALAD_ORGANISATION: ${SALAD_ORGANISATION:-}
      SALAD_PROJECT: ${SALAD_PROJECT:-}
      VAST_API_KEY: ${VAST_API_KEY:-}
      VAST_MAXIMUM_WORKERS: ${VAST_MAXIMUM_WORKERS:-1}
      VAST_MINIMUM_GPU_RAM_GB: ${VAST_MINIMUM_GPU_RAM_GB:-24}
      VAST_MINIMUM_GPU_RAM_MB: ${VAST_MINIMUM_GPU_RAM_MB:-24000}
      WORKER_API_KEY: ${WORKER_API_KEY:?set WORKER_API_KEY in .env}
      WORKER_IMAGE: ${WORKER_IMAGE:-ghcr.io/maxexcloo/comfy-control:worker}
      WORKFLOW_TIMEOUT: ${WORKFLOW_TIMEOUT:-900}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s
    ports:
      - 28081:8000
    restart: unless-stopped
    volumes:
      - ./config/control.yaml:/config/control.yaml:ro
      - data:/data

volumes:
  data:
