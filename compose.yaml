name: ai-router

services:
  bifrost:
    image: maximhq/bifrost:2.1.29
    depends_on:
      cliproxy:
        condition: service_healthy
      comfy-control:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:?set BIFROST_ADMIN_PASSWORD in .env}
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_API_KEY: ${BIFROST_API_KEY:?set BIFROST_API_KEY in .env}
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:?set BIFROST_ENCRYPTION_KEY in .env}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:?set CLIPROXY_API_KEY in .env}
      COMFY_CONTROL_API_KEY: ${COMFY_CONTROL_API_KEY:?set COMFY_CONTROL_API_KEY in .env}
      LOG_LEVEL: info
      LOG_STYLE: json
    healthcheck:
      test:
        [
          CMD,
          wget,
          --no-verbose,
          --tries=1,
          --spider,
          http://127.0.0.1:8080/health,
        ]
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 10s
    ports:
      - 28080:8080
    restart: unless-stopped
    volumes:
      - bifrost:/app/data
      - ./config/bifrost.bootstrap.json:/app/data/config.json:ro

  cliproxy:
    image: eceasy/cli-proxy-api:v7.2.127
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /CLIProxyAPI /root/.cli-proxy-api
        printf '%s\n' \
          'port: 8317' \
          'auth-dir: /root/.cli-proxy-api' \
          'api-keys:' \
          "  - $${CLIPROXY_API_KEY}" \
          'remote-management:' \
          '  allow-remote: true' \
          "  secret-key: $${CLIPROXY_MANAGEMENT_KEY}" \
          > /CLIProxyAPI/config.yaml
        exec /CLIProxyAPI/CLIProxyAPI
    environment:
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:?set CLIPROXY_API_KEY in .env}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:?set CLIPROXY_MANAGEMENT_KEY in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - "grep -q ':207D ' /proc/net/tcp /proc/net/tcp6"
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s
    ports:
      - 28317:8317
    restart: unless-stopped
    volumes:
      - cliproxy:/root/.cli-proxy-api

  comfy-control:
    build:
      context: .
      dockerfile: Dockerfile.control
    environment:
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:?set CLIPROXY_API_KEY in .env}
      CONTROL_API_KEY: ${COMFY_CONTROL_API_KEY:?set COMFY_CONTROL_API_KEY in .env}
      CONTROL_UI_PASSWORD: ${COMFY_CONTROL_UI_PASSWORD:?set COMFY_CONTROL_UI_PASSWORD in .env}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      SALAD_API_KEY: ${SALAD_API_KEY:-}
      VAST_API_KEY: ${VAST_API_KEY:-}
      WORKER_API_KEY: ${WORKER_API_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s
    ports:
      - 28081:8000
    restart: unless-stopped
    volumes:
      - comfy-control:/data
      - ./config/control.yaml:/config/control.yaml:ro

volumes:
  bifrost:
  cliproxy:
  comfy-control:
