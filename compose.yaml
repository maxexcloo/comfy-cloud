name: comfy-control

services:
  comfy-control:
    build: .
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
      COMFY_UI_PASSWORD: ${COMFY_UI_PASSWORD:?set COMFY_UI_PASSWORD in .env}
      COMFY_UI_USERNAME: ${COMFY_UI_USERNAME:-comfy}
      HF_TOKEN: ${HF_TOKEN:-}
      JOBS_DIR: /data/jobs
      MODEL_PROFILES: ${MODEL_PROFILES:-}
      MODELS_DIR: /opt/ComfyUI/models
    gpus: all
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 10s
    ports:
      - 28081:8000
    restart: unless-stopped
    volumes:
      - jobs:/data/jobs
      - models:/opt/ComfyUI/models
      - output:/opt/ComfyUI/output

volumes:
  jobs:
  models:
  output:
