name: profile image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Model profile to bake into the image
        options:
          - flux-2-klein-4b
        required: true
        type: choice

permissions:
  contents: read
  packages: write

concurrency:
  cancel-in-progress: false
  group: profile-image-${{ inputs.profile }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@v7
        with:
          build-args: MODEL_PROFILE=${{ inputs.profile }}
          cache-from: type=gha,scope=profile-${{ inputs.profile }}
          cache-to: type=gha,mode=max,scope=profile-${{ inputs.profile }}
          context: .
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          secrets: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.profile }}
            ${{ env.IMAGE_NAME }}:${{ inputs.profile }}-${{ github.sha }}
