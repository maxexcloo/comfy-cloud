name: container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  cancel-in-progress: true
  group: container-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          provenance: mode=max
          push: ${{ github.event_name != 'pull_request' }}
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Smoke-test container
        if: github.event_name == 'pull_request'
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.version }}
        run: |
          docker run --detach --name comfy-cloud-smoke \
            --env API_KEY=smoke-test-key \
            --env COMFYUI_ARGS="--cpu --listen 127.0.0.1 --port 8188" \
            --env MODE=serverless \
            --publish 8000:8000 \
            "${SMOKE_IMAGE}"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs comfy-cloud-smoke
          exit 1
      - name: Remove smoke-test container
        if: always() && github.event_name == 'pull_request'
        run: docker rm --force comfy-cloud-smoke || true

  profile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@v7
        with:
          build-args: MODEL_PROFILE=flux-2-klein-4b
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=profile-flux-2-klein-4b
          cache-to: type=gha,mode=max,scope=profile-flux-2-klein-4b
          context: .
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:flux-2-klein-4b
            ${{ env.IMAGE_NAME }}:flux-2-klein-4b-${{ github.sha }}
