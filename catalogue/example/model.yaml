id: example/checkpoint-text-to-image
profile: example
operation: image_generation
workflow: workflow.json
owned_by: comfy-cloud
aliases:
  - example
input_map:
  prompt: { node: "1", input: text }
  width: { node: "2", input: width }
  height: { node: "2", input: height }
  seed: { node: "3", input: seed }
  steps: { node: "3", input: steps }
output: { node: "4", type: image }
defaults:
  width: 1024
  height: 1024
  seed: 0
  steps: 20
required_files:
  - checkpoints/example.safetensors
